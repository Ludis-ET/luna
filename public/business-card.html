<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna Cottage AFH Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-deep: #2e1447;
        --brand-main: #58217a;
        --accent-gold: #c5a880;
        --accent-gold-dark: #a8885c;
        --cream-bg: #faf7f2;
        --white: #ffffff;
        --card-w: 3.75in;
        --card-h: 2.25in;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Outfit', system-ui, sans-serif;
        background: #e2dbd0;
        color: #2d2d2d;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        padding: 44px 16px 72px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .toolbar {
        position: sticky;
        top: 16px;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        max-width: 6in;
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(197, 168, 128, 0.3);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 16px 40px -15px rgba(45, 45, 45, 0.15);
      }
      .toolbar-text { font-size: 13.5px; color: #555; }
      .btn {
        appearance: none; border: none; cursor: pointer;
        font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px;
        color: var(--cream-bg); background: var(--brand-deep);
        padding: 12px 28px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 8px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 12px rgba(46, 20, 71, 0.2);
      }
      .btn:hover { transform: translateY(-2px); background: var(--brand-main); box-shadow: 0 8px 20px rgba(46, 20, 71, 0.35); }
      .btn svg { transition: transform 0.25s ease; }
      .btn:hover svg { transform: translateY(2px); }

      /* ---------- Business card: 3.75in × 2.25in ---------- */
      .card {
        position: relative;
        width: var(--card-w);
        height: var(--card-h);
        display: flex;
        overflow: hidden;
        border-radius: 11px;
        box-shadow: 0 24px 55px -18px rgba(46, 20, 71, 0.55);
        background:
          radial-gradient(120% 85% at 62% -12%, rgba(197, 168, 128, 0.16) 0%, transparent 52%),
          linear-gradient(145deg, #371a52 0%, var(--brand-deep) 46%, #25103a 100%);
      }

      .frame {
        position: absolute;
        inset: 0.11in;
        border: 1px solid var(--accent-gold);
        border-radius: 7px;
        pointer-events: none;
        z-index: 6;
      }
      .frame::after {
        content: '';
        position: absolute;
        inset: 3px;
        border: 1px solid var(--accent-gold);
        border-radius: 5px;
        opacity: 0.45;
      }

      .brand-side {
        position: relative;
        z-index: 4;
        flex: 0 0 43%;
        padding: 0.28in 0.23in;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-right: 1px solid rgba(197, 168, 128, 0.28);
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--accent-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-gold);
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 20px;
      }
      .brand-name {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 700;
        font-size: 21px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--accent-gold);
        margin-top: 9px;
      }
      .brand-sub {
        font-size: 6.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-top: 4px;
        font-weight: 500;
      }
      .owner .name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--cream-bg);
        line-height: 1.15;
      }
      .owner .tag {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 9px;
        color: var(--accent-gold);
        opacity: 0.92;
        margin-top: 7px;
      }

      .info-side {
        position: relative;
        z-index: 4;
        flex: 1;
        padding: 0.22in 0.26in;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
      }
      .info-heading {
        font-family: 'Cormorant Garamond', serif;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-gold);
        position: relative;
        padding-bottom: 5px;
        margin-bottom: 1px;
      }
      .info-heading::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, var(--accent-gold), rgba(197, 168, 128, 0.35));
      }
      .row { display: flex; align-items: flex-start; gap: 7px; }
      .row .ico { flex: 0 0 auto; width: 11px; margin-top: 1px; color: var(--accent-gold); }
      .row .ico svg { width: 11px; height: 11px; display: block; }
      .row .txt { line-height: 1.25; }
      .row .txt .lbl {
        display: block;
        font-size: 5.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-gold);
        font-weight: 600;
      }
      .row .txt .val { font-size: 8.5px; font-weight: 600; color: var(--cream-bg); }
      .row.address .val { font-size: 7.5px; line-height: 1.2; }

      @media print {
        @page {
          size: 3.75in 2.25in;
          margin: 0;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html,
        body {
          width: var(--card-w);
          height: var(--card-h);
          margin: 0;
          padding: 0;
          background: #fff !important;
        }

        body {
          display: block;
        }

        .toolbar {
          display: none !important;
        }

        .card {
          width: var(--card-w) !important;
          height: var(--card-h) !important;
          border-radius: 0;
          box-shadow: none !important;
          page-break-inside: avoid;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="toolbar-text">Luna Cottage Business Card · 3.75″ × 2.25″</div>
      <button class="btn" onclick="window.print()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download
      </button>
    </div>

    <div class="card">
      <div class="frame"></div>

      <div class="brand-side">
        <div>
          <div class="logo">L</div>
          <div class="brand-name">Luna Cottage</div>
          <div class="brand-sub">Adult Family Home</div>
        </div>
        <div class="owner">
          <div class="name">Fitsum Awoke, RN, BSN</div>
          <div class="tag">Where care feels like home.</div>
        </div>
      </div>

      <div class="info-side">
        <div class="info-heading">Get in touch</div>

        <div class="row">
          <span class="ico">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.3a1 1 0 01.97.757l.9 3.6a1 1 0 01-.29.96l-1.5 1.5a14 14 0 006.3 6.3l1.5-1.5a1 1 0 01.96-.29l3.6.9A1 1 0 0121 17.7V20a2 2 0 01-2 2A16 16 0 013 5z"/></svg>
          </span>
          <span class="txt"><span class="lbl">Call or Text</span><span class="val">206-398-9638</span></span>
        </div>

        <div class="row">
          <span class="ico">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9.5L12 4l9 5.5M5 10v9a1 1 0 001 1h12a1 1 0 001-1v-9"/></svg>
          </span>
          <span class="txt"><span class="lbl">Office</span><span class="val">425-337-9724</span></span>
        </div>

        <div class="row">
          <span class="ico">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 9V3h10v6M7 19H5a2 2 0 01-2-2v-3a2 2 0 012-2h14a2 2 0 012 2v3a2 2 0 01-2 2h-2M7 15h10v6H7z"/></svg>
          </span>
          <span class="txt"><span class="lbl">Fax</span><span class="val">425-357-1170</span></span>
        </div>

        <div class="row">
          <span class="ico">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
          </span>
          <span class="txt"><span class="lbl">Email</span><span class="val">Emunetluna@gmail.com</span></span>
        </div>

        <div class="row address">
          <span class="ico">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </span>
          <span class="txt"><span class="lbl">Address</span><span class="val">10524 23rd Dr SE, Everett, WA 98208</span></span>
        </div>
      </div>
    </div>
  </body>
</html>
