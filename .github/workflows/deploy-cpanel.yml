name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prepare FTP host
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          HOST=$(printf '%s' "$CPANEL_HOST" | tr -d '\r\n' | sed -E \
            -e 's|^["'\'']||; s|["'\'']$||' \
            -e 's|^[Ff][Tt][Pp][Ss]*://||' \
            -e 's|^[Ss][Ff][Tt][Pp]://||' \
            -e 's|/.*||' \
            -e 's|:.*||' \
            -e 's/[[:space:]]//g')
          if [ -z "$HOST" ]; then
            echo "::error::CPANEL_HOST secret is empty. Add the FTP server from cPanel → FTP Accounts."
            exit 1
          fi
          echo "Using FTP host: $HOST"
          echo "FTP_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
